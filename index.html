<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Sterowania Słupkami v2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #222; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .widok { display: none; width: 100%; max-width: 600px; padding: 20px; flex-direction: column; align-items: center; text-align: center; }
        .widok.aktywny { display: flex; }

        h1, h2, h3 { margin-bottom: 15px; }
        
        .btn {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #2980b9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active { background-color: #1f618d; }
        .btn-zielony { background-color: #2ecc71; }
        .btn-zielony:active { background-color: #27ae60; }
        .btn-czerwony { background-color: #e74c3c; }
        .btn-czerwony:active { background-color: #c0392b; }
        .btn-pomaranczowy { background-color: #e67e22; }
        .btn-pomaranczowy:active { background-color: #d35400; }
        .btn-fioletowy { background-color: #9b59b6; }
        .btn-fioletowy:active { background-color: #8e44ad; }
        .btn:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }

        #map { width: 100%; height: 200px; border-radius: 8px; margin-bottom: 15px; border: 2px solid #555; }
        
        .statystyki-bar {
            width: 100%;
            background: #2c3e50;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #34495e;
            display: flex;
            justify-content: space-around;
        }

        .parking-container {
            width: 100%;
            background: #111;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .parking-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .parking-road {
            height: 20px;
            margin: 8px 0;
            background: #2a2a2a;
            border-top: 2px dashed #666;
            border-bottom: 2px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
        }
        .parking-spot {
            background: #222;
            border: 2px solid #555;
            border-radius: 6px;
            padding: 6px 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 65px;
            transition: all 0.2s;
        }
        .parking-spot.wolny { border-color: #2ecc71; color: #2ecc71; }
        .parking-spot.zajety { border-color: #e74c3c; color: #e74c3c; background: #3a1a1a; }
        .parking-spot.moj { border-color: #f39c12; color: #f39c12; background: #3a2e1a; }
        .parking-spot.wybrany { outline: 3px solid #f1c40f; transform: scale(1.04); }
        .parking-spot .spot-id { font-weight: bold; font-size: 13px; }
        .parking-spot .spot-status { font-size: 9px; margin-top: 2px; font-weight: bold; }
        .parking-spot .spot-rej { font-size: 8px; margin-top: 2px; color: #f1c40f; font-weight: bold; word-break: break-all; max-width: 100%; }
        .parking-spot .spot-time { font-size: 8px; margin-top: 1px; color: #ccc; }

        .panel-akcji-pilot {
            width: 100%;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
            text-align: left;
        }
        
        .form-group {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label { font-size: 13px; color: #ccc; }
        .form-group select, .form-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 15px;
        }

        .input-rejestracja {
            text-transform: uppercase;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid #2980b9 !important;
            background: #1a252f !important;
        }

        .komunikat-blad {
            background: #c0392b;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            display: none;
            font-weight: bold;
            text-align: center;
        }

        .prip-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

        #kolo { width: 160px; height: 160px; border-radius: 50%; margin: 20px auto; background-color: #555; transition: background-color 0.3s ease; }
        #tekst { font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        
        #btn-permission { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: rgba(41, 128, 185, 0.95); color: white; 
            z-index: 9999; border: none; font-size: 24px; font-weight: bold; 
            cursor: pointer; padding: 40px; text-align: center; display: none;
        }

        #debug { margin-top: 15px; font-family: monospace; font-size: 13px; color: #ff9f43; }
        .btn-powrot { margin-top: 15px; background-color: #555; width: auto; padding: 8px 20px; font-size: 14px; align-self: center; }
    </style>
</head>
<body>

    <div id="widok-wybor" class="widok aktywny">
        <h1>WYBIERZ ROLĘ URZĄDZENIA</h1>
        <button class="btn" onclick="przejdzDo('widok-pilot')">PILOT (KIEROWCA)</button>
        <button class="btn btn-pomaranczowy" onclick="zweryfikujHasloISlupka()">SŁUPEK (STACJA)</button>
    </div>

    <div id="widok-pilot" class="widok">
        <h2>PANEL PILOTA - PARKING</h2>
        
        <div class="panel-akcji-pilot" style="margin-bottom: 15px; background: #2c3e50;">
            <div class="form-group" style="margin: 0;">
                <label for="input-nr-rej" style="color: #fff; font-weight: bold;">TWÓJ NUMER REJESTRACYJNY POJAZDU:</label>
                <input type="text" id="input-nr-rej" class="input-rejestracja" placeholder="NP. EP 12345" maxlength="10">
            </div>
        </div>

        <div class="statystyki-bar" id="statystyki-parkingu">
            <span>Wolne: - / 10</span>
            <span>Zajęte: - / 10</span>
        </div>

        <div id="map"></div>

        <div class="parking-container">
            <div class="parking-row" id="parking-rzad-1"></div>
            <div class="parking-road">PAS RUCHU (UL. ORLA)</div>
            <div class="parking-row" id="parking-rzad-2"></div>
        </div>

        <div id="panel-akcji" class="panel-akcji-pilot" style="display: none;">
            <h3 id="wybrany-slupek-naglowek">Wybrane miejsce: -</h3>
            <p id="wybrany-slupek-status" style="font-size: 14px; margin-bottom: 6px;"></p>
            <p id="wybrany-slupek-rej" style="font-size: 14px; font-weight: bold; color: #f1c40f; margin-bottom: 6px;"></p>
            <p id="wybrany-slupek-czas" style="font-size: 13px; color: #3498db; margin-bottom: 10px;"></p>
            
            <div id="komunikat-blad" class="komunikat-blad"></div>

            <div class="form-group" id="grupa-czasu">
                <label for="czas-rezerwacji">Czas rezerwacji:</label>
                <select id="czas-rezerwacji">
                    <option value="15">15 minut</option>
                    <option value="30" selected>30 minut</option>
                    <option value="60">1 godzinę</option>
                    <option value="120">2 godziny</option>
                </select>
            </div>

            <div class="prip-buttons">
                <button class="btn btn-czerwony" id="btn-rezerwuj" onclick="rezerwujWybrany()">REZERWUJ</button>
                <button class="btn btn-fioletowy" id="btn-przedluz" onclick="przedluzWybrany()">PRZEDŁUŻ (+15 MIN)</button>
                <button class="btn btn-zielony" id="btn-zwolnij" onclick="zwolnijWybrany()">ZWOLNIJ SŁUPEK</button>
            </div>
        </div>

        <button class="btn btn-powrot" onclick="przejdzDo('widok-wybor')">← Zmień rolę</button>
    </div>

    <div id="widok-wybor-slupka" class="widok">
        <h2>WYBIERZ IDENTYFIKATOR SŁUPKA</h2>
        <div id="kontener-wyboru-slupka" style="width: 100%;"></div>
        <button class="btn btn-powrot" onclick="przejdzDo('widok-wybor')">← Zmień rolę</button>
    </div>

    <div id="widok-status-slupka" class="widok">
        <button id="btn-permission" onclick="odblokujSygnalizacje()">
            DOTKNIJ EKRANU TEL. SŁUPKA<br><br>
            Aby odblokować sygnały dźwiękowe i wibracje
        </button>

        <h2 id="naglowek-slupka">Status Słupka</h2>
        <div id="kolo"></div>
        <div id="tekst">Oczekiwanie na aktywację...</div>
        
        <button class="btn" id="btn-akcja-stacja">ŁADOWANIE...</button>
        <div id="debug">Status: Oczekiwanie</div>
        <button class="btn btn-powrot" onclick="wyczyscIPrzejdzDoWyboru()">← Zmień słupek</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNHjRqpMW1yeIynRmuYcRYMWabn4O31M0",
            authDomain: "sterowanie-slupkiem10-v2.firebaseapp.com",
            databaseURL: "https://sterowanie-slupkiem10-v2-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sterowanie-slupkiem10-v2",
            storageBucket: "sterowanie-slupkiem10-v2.firebasestorage.app",
            messagingSenderId: "666796401317",
            appId: "1:666796401317:web:973a89fe20ec9b8f6d234c"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const SLUPKI_CONFIG = [
            { id: 'A1',  lat: 51.75820, lng: 19.45980 },
            { id: 'A2',  lat: 51.75822, lng: 19.46010 },
            { id: 'A3',  lat: 51.75824, lng: 19.46040 },
            { id: 'A4',  lat: 51.75826, lng: 19.46070 },
            { id: 'A5',  lat: 51.75828, lng: 19.46100 },
            { id: 'A6',  lat: 51.75830, lng: 19.46130 },
            { id: 'A7',  lat: 51.75832, lng: 19.46160 },
            { id: 'A8',  lat: 51.75834, lng: 19.46190 },
            { id: 'A9',  lat: 51.75836, lng: 19.46220 },
            { id: 'A10', lat: 51.75838, lng: 19.46250 }
        ];

        let mapa = null;
        let markery = {};
        let stanySlupkow = {};
        let wybraneMiejsceId = null;
        let aktywnySlupekId = null;
        let subskrypcjaSlupka = null;
        let audioCtx = null;
        let interfejsOdblokowany = false;
        let poprzedniStan = null;
        let intervalZegara = null;

        const inputNrRej = document.getElementById('input-nr-rej');
        inputNrRej.value = localStorage.getItem('uzytkownik_rejestracja') || '';
        inputNrRej.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase();
            e.target.value = val;
            localStorage.setItem('uzytkownik_rejestracja', val);
            aktualizujWidokPilota();
        });

        function normalizujRejestracje(str) {
            return (str || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        }

        window.zweryfikujHasloISlupka = function() {
            const haslo = prompt("Wprowadź hasło dostępu do roli SŁUPEK:");
            if (haslo === "1234") {
                przejdzDo('widok-wybor-slupka');
            } else if (haslo !== null) {
                alert("Nieprawidłowe hasło!");
            }
        };

        window.przejdzDo = function(idWidoku) {
            document.querySelectorAll('.widok').forEach(el => el.classList.remove('aktywny'));
            document.getElementById(idWidoku).classList.add('aktywny');

            if (idWidoku === 'widok-pilot') {
                inicjalizujPilota();
            } else if (idWidoku === 'widok-wybor-slupka') {
                generujLasteWyboruSlupka();
            }
        };

        function pobierzStatusIEndtime(stan) {
            if (typeof stan === 'object' && stan !== null) {
                return {
                    status: Number(stan.status || 0),
                    doKiedy: Number(stan.doKiedy || 0),
                    adminLock: Boolean(stan.adminLock),
                    nrRejestracyjny: stan.nrRejestracyjny || "",
                    wyswietlanyNrRej: stan.wyswietlanyNrRej || stan.nrRejestracyjny || ""
                };
            }
            return { status: Number(stan || 0), doKiedy: 0, adminLock: false, nrRejestracyjny: "", wyswietlanyNrRej: "" };
        }

        function inicjalizujPilota() {
            if (!mapa) {
                mapa = L.map('map').setView([51.7583, 19.4611], 17);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);

                SLUPKI_CONFIG.forEach(s => {
                    const marker = L.circleMarker([s.lat, s.lng], {
                        radius: 7, fillColor: "#555", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
                    }).addTo(mapa).bindPopup(Słupek ${s.id});
                    markery[s.id] = marker;
                });
            }
            setTimeout(() => mapa.invalidateSize(), 200);

            if (!intervalZegara) {
                intervalZegara = setInterval(aktualizujWidokPilota, 5000);
            }

            onValue(ref(database, 'slupki'), (snapshot) => {
                stanySlupkow = snapshot.val() || {};
                aktualizujWidokPilota();
            });
        }

        function formatujPozostalyCzas(doKiedy) {
            if (!doKiedy) return "";
            const teraz = Date.now();
            const roznicaMs = doKiedy - teraz;
            if (roznicaMs <= 0) return "Wygasa";
            
            const minuty = Math.ceil(roznicaMs / (1000 * 60));
            if (minuty > 60) {
                const h = Math.floor(minuty / 60);
                const m = minuty % 60;
                return za ${h}h ${m}m;
            }
            return za ${minuty}m;
        }

        function formatujGodzine(doKiedy) {
            if (!doKiedy) return "";
            const d = new Date(doKiedy);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return ${hh}:${mm};
        }

        function renderujParkingGrid() {
            const rzad1 = document.getElementById('parking-rzad-1');
            const rzad2 = document.getElementById('parking-rzad-2');
            rzad1.innerHTML = '';
            rzad2.innerHTML = '';

            let wolneLicznik = 0;
            let zajeteLicznik = 0;
            const mojNrNorm = normalizujRejestracje(inputNrRej.value);

            SLUPKI_CONFIG.forEach((s, index) => {
                const info = pobierzStatusIEndtime(stanySlupkow[s.id]);
                const jestZajety = info.status === 1;
                const rejestracjaSlupekNorm = normalizujRejestracje(info.nrRejestracyjny);
                const jestMojaRezerwacja = jestZajety && mojNrNorm !== '' && (mojNrNorm === rejestracjaSlupekNorm);
                const jestWybrany = s.id === wybraneMiejsceId;

                if (jestZajety) zajeteLicznik++;
                else wolneLicznik++;

                let klasaKlasaSpot = 'wolny';
                if (jestZajety) {
                    klasaKlasaSpot = jestMojaRezerwacja ? 'moj' : 'zajety';
                }

                const spot = document.createElement('div');
                spot.className = parking-spot ${klasaKlasaSpot} ${jestWybrany ? 'wybrany' : ''};
                spot.onclick = () => wybierzMiejsceNaParkingu(s.id);

                let rejTekst = "";
                let czasTekst = "";
                if (jestZajety) {
                    if (info.wyswietlanyNrRej) {
                        rejTekst = <div class="spot-rej">${info.wyswietlanyNrRej}</div>;
                    }
                    if (info.adminLock) {
                        czasTekst = <div class="spot-time" style="color:#e74c3c;">ADMIN</div>;
                    } else if (info.doKiedy) {
                        czasTekst = <div class="spot-time">${formatujPozostalyCzas(info.doKiedy)}</div>;
                    }
                }

                spot.innerHTML = `
                    <div class="spot-id">${s.id}</div>
                    <div class="spot-status">${jestZajety ? (jestMojaRezerwacja ? 'MOJA' : 'ZAJĘTY') : 'WOLNY'}</div>
                    ${rejTekst}
                    ${czasTekst}
                `;

                if (index < 5) rzad1.appendChild(spot);
                else rzad2.appendChild(spot);
            });

            document.getElementById('statystyki-parkingu').innerHTML = `
                <span>Wolne: ${wolneLicznik} / 10</span>
                <span>Zajęte: ${zajeteLicznik} / 10</span>
            `;
        }

        function wybierzMiejsceNaParkingu(id) {
            wybraneMiejsceId = id;
            ukryjBlad();
            aktualizujWidokPilota();
        }

        function ukryjBlad() {
            const el = document.getElementById('komunikat-blad');
            el.style.display = 'none';
            el.innerText = '';
        }

        function pokazBlad(tresc) {
            const el = document.getElementById('komunikat-blad');
            el.innerText = tresc;
            el.style.display = 'block';
        }

        function aktualizujWidokPilota() {
            renderujParkingGrid();

            const mojNrNorm = normalizujRejestracje(inputNrRej.value);

            SLUPKI_CONFIG.forEach(s => {
                const info = pobierzStatusIEndtime(stanySlupkow[s.id]);
                const podniesiony = info.status === 1;
                const jestMoja = podniesiony && mojNrNorm !== '' && (mojNrNorm === normalizujRejestracje(info.nrRejestracyjny));
                
                if (markery[s.id]) {
                    markery[s.id].setStyle({
                        fillColor: podniesiony ? (jestMoja ? '#f39c12' : '#e74c3c') : '#2ecc71'
                    });
                }
            });

            const panel = document.getElementById('panel-akcji');
            if (wybraneMiejsceId) {
                panel.style.display = 'block';
                const info = pobierzStatusIEndtime(stanySlupkow[wybraneMiejsceId]);
                const jestZajety = info.status === 1;
                const rejestracjaSlupekNorm = normalizujRejestracje(info.nrRejestracyjny);
                const jestMojaRezerwacja = jestZajety && mojNrNorm !== '' && (mojNrNorm === rejestracjaSlupekNorm);

                document.getElementById('wybrany-slupek-naglowek').innerText = Miejsce: ${wybraneMiejsceId};

                if (info.adminLock) {
                    document.getElementById('wybrany-slupek-status').innerText = Status: ZABLOKOWANE PRZEZ ADMINA / SŁUPEK;
                    document.getElementById('wybrany-slupek-rej').innerText = info.wyswietlanyNrRej ? Rejestracja: ${info.wyswietlanyNrRej} : '';
                    document.getElementById('wybrany-slupek-czas').innerText = Zwolnienie możliwe wyłącznie ze stacji słupka!;
                    document.getElementById('grupa-czasu').style.display = 'none';
                    document.getElementById('btn-rezerwuj').style.display = 'none';
                    document.getElementById('btn-przedluz').style.display = 'none';
                    document.getElementById('btn-zwolnij').style.display = 'none';
                } else if (jestZajety && jestMojaRezerwacja) {
                    document.getElementById('wybrany-slupek-status').innerText = Status: ZAREZERWOWANE DLA TWOJEGO POJAZDU;
                    document.getElementById('wybrany-slupek-rej').innerText = Nr rej.: ${info.wyswietlanyNrRej};
                    if (info.doKiedy) {
                        document.getElementById('wybrany-slupek-czas').innerText = Rezerwacja do: ${formatujGodzine(info.doKiedy)} (${formatujPozostalyCzas(info.doKiedy)});
                    } else {
                        document.getElementById('wybrany-slupek-czas').innerText = "";
                    }
                    document.getElementById('grupa-czasu').style.display = 'none';
                    document.getElementById('btn-rezerwuj').style.display = 'none';
                    document.getElementById('btn-przedluz').style.display = 'block';
                    document.getElementById('btn-zwolnij').style.display = 'block';
                } else if (jestZajety && !jestMojaRezerwacja) {
                    document.getElementById('wybrany-slupek-status').innerText = Status: ZAREZERWOWANE PRZEZ INNEGO UŻYTKOWNIKA;
                    document.getElementById('wybrany-slupek-rej').innerText = Pojazd: ${info.wyswietlanyNrRej || 'BRAK NR REJ.'};
                    if (info.doKiedy) {
                        document.getElementById('wybrany-slupek-czas').innerText = Przewidywane zwolnienie: ${formatujGodzine(info.doKiedy)} (${formatujPozostalyCzas(info.doKiedy)});
                    } else {
                        document.getElementById('wybrany-slupek-czas').innerText = "";
                    }
                    document.getElementById('grupa-czasu').style.display = 'none';
                    document.getElementById('btn-rezerwuj').style.display = 'none';
                    document.getElementById('btn-przedluz').style.display = 'none';
                    document.getElementById('btn-zwolnij').style.display = 'block'; // Pozwól kliknąć, ale weryfikuj numer rejestracyjny
                } else {
                    document.getElementById('wybrany-slupek-status').innerText = Status: WOLNE;
                    document.getElementById('wybrany-slupek-rej').innerText = '';
                    document.getElementById('wybrany-slupek-czas').innerText = "";
                    document.getElementById('grupa-czasu').style.display = 'flex';
                    document.getElementById('btn-rezerwuj').style.display = 'block';
                    document.getElementById('btn-przedluz').style.display = 'none';
                    document.getElementById('btn-zwolnij').style.display = 'none';
                }
            } else {
                panel.style.display = 'none';
            }
        }

        window.rezerwujWybrany = function() {
            if (!wybraneMiejsceId) return;
            ukryjBlad();

            const podanaRej = inputNrRej.value.trim();
            if (!podanaRej) {
                pokazBlad("Wprowadź swój numer rejestracyjny na górze ekranu przed rezerwacją!");
                inputNrRej.focus();
                return;
            }

            const info = pobierzStatusIEndtime(stanySlupkow[wybraneMiejsceId]);
            if (info.status === 1) {
                pokazBlad(Miejsce ${wybraneMiejsceId} jest już zajęte! Wybierz inne miejsce.);
                return;
            }

            const minuty = parseInt(document.getElementById('czas-rezerwacji').value) || 30;
            const doKiedy = Date.now() + (minuty * 60 * 1000);

            set(ref(database, 'slupki/' + wybraneMiejsceId), {
                status: 1,
                doKiedy: doKiedy,
                adminLock: false,
                nrRejestracyjny: normalizujRejestracje(podanaRej),
                wyswietlanyNrRej: podanaRej.toUpperCase()
            });
        };

        window.przedluzWybrany = function() {
            if (!wybraneMiejsceId) return;
            ukryjBlad();

            const info = pobierzStatusIEndtime(stanySlupkow[wybraneMiejsceId]);
            if (info.adminLock) {
                pokazBlad(Miejsce ${wybraneMiejsceId} posiada blokadę admina.);
                return;
            }
            if (info.status !== 1) {
                pokazBlad(Miejsce ${wybraneMiejsceId} nie jest obecnie zajęte.);
                return;
            }

            const mojNrNorm = normalizujRejestracje(inputNrRej.value);
            const rejZarezerwowanaNorm = normalizujRejestracje(info.nrRejestracyjny);

            if (mojNrNorm !== rejZarezerwowanaNorm) {
                pokazBlad(Nie możesz przedłużyć rezerwacji przypisanej do pojazdu: ${info.wyswietlanyNrRej});
                return;
            }

            let bazowyCzas = info.doKiedy > Date.now() ? info.doKiedy : Date.now();
            const nowyDoKiedy = bazowyCzas + (15 * 60 * 1000);

            set(ref(database, 'slupki/' + wybraneMiejsceId), {
                status: 1,
                doKiedy: nowyDoKiedy,
                adminLock: false,
                nrRejestracyjny: info.nrRejestracyjny,
                wyswietlanyNrRej: info.wyswietlanyNrRej
            });
        };

        window.zwolnijWybrany = function() {
            if (!wybraneMiejsceId) return;
            ukryjBlad();
            const info = pobierzStatusIEndtime(stanySlupkow[wybraneMiejsceId]);
            
            if (info.adminLock) {
                pokazBlad(Brak uprawnień. Miejsce zablokowane ze stacji słupka/admina.);
                return;
            }

            const wpisanaRejNorm = normalizujRejestracje(inputNrRej.value);
            const zarezerwowanaRejNorm = normalizujRejestracje(info.nrRejestracyjny);

            // Jeśli nr rejestracyjny się nie zgadza
            if (zarezerwowanaRejNorm !== "" && wpisanaRejNorm !== zarezerwowanaRejNorm) {
                const weryfikacja = prompt(Słupek jest zarezerwowany dla pojazdu ${info.wyswietlanyNrRej}.\nAby go zwolnić, podaj pełny numer rejestracyjny tego pojazdu:);
                if (!weryfikacja || normalizujRejestracje(weryfikacja) !== zarezerwowanaRejNorm) {
                    pokazBlad(Nieprawidłowy numer rejestracyjny! Brak uprawnień do zwolnienia słupka ${wybraneMiejsceId}.);
                    return;
                }
            }

            set(ref(database, 'slupki/' + wybraneMiejsceId), {
                status: 0,
                doKiedy: 0,
                adminLock: false,
                nrRejestracyjny: "",
                wyswietlanyNrRej: ""
            });
        };

        function generujLasteWyboruSlupka() {
            const kontener = document.getElementById('kontener-wyboru-slupka');
            kontener.innerHTML = '';
            SLUPKI_CONFIG.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = STACJA SŁUPKA ${s.id};
                btn.onclick = () => wybiezSlupekIUruchom(s.id);
                kontener.appendChild(btn);
            });
        }

        function wybiezSlupekIUruchom(id) {
            aktywnySlupekId = id;
            document.getElementById('naglowek-slupka').innerText = "Status Słupka " + id;
            document.getElementById('btn-permission').style.display = 'block';
            przejdzDo('widok-status-slupka');
        }

        window.odblokujSygnalizacje = function() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                interfejsOdblokowany = true;
                document.getElementById('btn-permission').style.display = 'none';
                document.getElementById('tekst').innerText = "Połączono. Oczekiwanie na dane...";
                document.getElementById('debug').innerText = "Status: Aktywny";
                if (navigator.vibrate) navigator.vibrate(100);
                startNasluchSlupka();
            } catch (e) {
                document.getElementById('debug').innerText = "Błąd AudioContext: " + e.message;
            }
        };

        function startNasluchSlupka() {
            if (subskrypcjaSlupka) subskrypcjaSlupka();
            subskrypcjaSlupka = onValue(ref(database, 'slupki/' + aktywnySlupekId), (snapshot) => {
                const info = pobierzStatusIEndtime(snapshot.val());
                const kolo = document.getElementById('kolo');
                const logoTekst = document.getElementById('tekst');
                const btnAkcja = document.getElementById('btn-akcja-stacja');

                if (info.status === 1) {
                    kolo.style.backgroundColor = '#e74c3c';
                    logoTekst.innerText = info.adminLock ? "PODNIESIONY (BLOKADA ADMINA)" : "SŁUPEK PODNIESIONY";
                    btnAkcja.innerText = "ZWOLNIJ SŁUPEK";
                    btnAkcja.className = "btn btn-zielony";
                    btnAkcja.onclick = zwolnijSlupekStacja;
                    if (poprzedniStan !== 1) { wykonajSygnalizacje(1); poprzedniStan = 1; }
                } else {
                    kolo.style.backgroundColor = '#2ecc71';
                    logoTekst.innerText = "SŁUPEK OPUSZCZONY";
                    btnAkcja.innerText = "ZABLOKUJ SŁUPEK (BLOKADA ADMINA)";
                    btnAkcja.className = "btn btn-czerwony";
                    btnAkcja.onclick = zablokujSlupekStacja;
                    if (poprzedniStan !== 0) { wykonajSygnalizacje(0); poprzedniStan = 0; }
                }
            });
        }

        window.zwolnijSlupekStacja = function() {
            if (!aktywnySlupekId) return;
            set(ref(database, 'slupki/' + aktywnySlupekId), {
                status: 0,
                doKiedy: 0,
                adminLock: false,
                nrRejestracyjny: "",
                wyswietlanyNrRej: ""
            })
            .then(() => { document.getElementById('debug').innerText = "Zwolniono słupek ze stacji"; })
            .catch(err => { document.getElementById('debug').innerText = "Błąd zapisu: " + err.message; });
        };

        window.zablokujSlupekStacja = function() {
            if (!aktywnySlupekId) return;
            set(ref(database, 'slupki/' + aktywnySlupekId), {
                status: 1,
                doKiedy: 0,
                adminLock: true,
                nrRejestracyjny: "",
                wyswietlanyNrRej: ""
            })
            .then(() => { document.getElementById('debug').innerText = "Zablokowano słupek (Blokada Admina)"; })
            .catch(err => { document.getElementById('debug').innerText = "Błąd zapisu: " + err.message; });
        };

        window.wyczyscIPrzejdzDoWyboru = function() {
            aktywnySlupekId = null;
            poprzedniStan = null;
            przejdzDo('widok-wybor-slupka');
        };

        function generujDzwiek(czestotliwosc, czasTrwaniaMs) {
            if (!audioCtx || !interfejsOdblokowany) return;
            try {
                const oscylator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscylator.type = 'sine';
                oscylator.frequency.setValueAtTime(czestotliwosc, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + (czasTrwaniaMs / 1000));
                oscylator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscylator.start();
                oscylator.stop(audioCtx.currentTime + (czasTrwaniaMs / 1000));
            } catch (err) { console.log("Błąd dźwięku:", err); }
        }

        function wykonajSygnalizacje(stan) {
            if (stan === 1) {
                generujDzwiek(880, 150);
                setTimeout(() => generujDzwiek(880, 150), 200);
                setTimeout(() => generujDzwiek(1200, 300), 400);
                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
            } else if (stan === 0) {
                generujDzwiek(440, 200);
                setTimeout(() => generujDzwiek(330, 300), 250);
                if (navigator.vibrate) navigator.vibrate(500);
            }
        }
    </script>
</body>
</html>
