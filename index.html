<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Sterowania Słupkami v2.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #222; color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .widok { display: none; width: 100%; max-width: 600px; padding: 20px; flex-direction: column; align-items: center; }
        .widok.aktywny { display: flex; }
        h1, h2, h3 { margin-bottom: 15px; text-align: center; }
        
        .btn {
            width: 100%; padding: 16px; margin: 8px 0; font-size: 18px; font-weight: bold;
            color: white; background-color: #2980b9; border: none; border-radius: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .btn:active { background-color: #1f618d; }
        .btn-zielony { background-color: #2ecc71; }
        .btn-zielony:active { background-color: #27ae60; }
        .btn-czerwony { background-color: #e74c3c; }
        .btn-czerwony:active { background-color: #c0392b; }
        .btn-pomaranczowy { background-color: #e67e22; }
        .btn-pomaranczowy:active { background-color: #d35400; }
        .btn-powrot { margin-top: 15px; background-color: #555; width: auto; padding: 8px 20px; font-size: 14px; }
        
        #map { width: 100%; height: 220px; border-radius: 8px; margin-bottom: 15px; border: 2px solid #555; }
        
        .parking-container { width: 100%; background: #111; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #444; }
        .parking-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .parking-road {
            height: 24px; margin: 8px 0; background: #2a2a2a; border-top: 2px dashed #666;
            border-bottom: 2px dashed #666; display: flex; align-items: center; justify-content: center;
            font-size: 10px; letter-spacing: 2px; color: #888;
        }
        .parking-spot {
            background: #222; border: 2px solid #555; border-radius: 6px; padding: 8px 2px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 55px; transition: all 0.2s;
        }
        .parking-spot.wolny { border-color: #2ecc71; color: #2ecc71; }
        .parking-spot.zajety { border-color: #e74c3c; color: #e74c3c; background: #3a1a1a; }
        .parking-spot.wybrany { outline: 3px solid #f1c40f; transform: scale(1.04); }
        .spot-id { font-weight: bold; font-size: 13px; }
        .spot-status { font-size: 9px; margin-top: 3px; font-weight: bold; }
        
        .panel-akcji-pilot { width: 100%; background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .panel-akcji-pilot.aktywny { display: block; }
        .input-tablica {
            width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; text-transform: uppercase;
            text-align: center; border-radius: 6px; border: 1px solid #666; background: #111; color: #fff;
            letter-spacing: 1px; font-weight: bold;
        }
        .prip-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .prip-buttons .btn { margin: 0; }
        
        #kolo { width: 160px; height: 160px; border-radius: 50%; margin: 20px auto; background-color: #555; transition: background 0.3s; }
        #tekst { font-size: 22px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        #btn-permission {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(41, 128, 185, 0.95); color: white; z-index: 9999;
            border: none; font-size: 24px; font-weight: bold; cursor: pointer; padding: 40px; text-align: center; display: none;
        }
        #debug { margin-top: 15px; font-family: monospace; font-size: 13px; color: #ff9f43; text-align: center; }
        #komunikat-bledu { color: #e74c3c; font-size: 13px; margin-top: 5px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div id="widok-wybor" class="widok aktywny">
        <h1>WYBIERZ ROLĘ URZĄDZENIA</h1>
        <button class="btn" onclick="przejdzDo('widok-pilot')">PILOT (KIEROWCA)</button>
        <button class="btn btn-pomaranczowy" onclick="przejdzDo('widok-wybor-slupka')">SŁUPEK (STACJA)</button>
    </div>

    <div id="widok-pilot" class="widok">
        <h2>PANEL PILOTA PARKINGU</h2>
        <div id="map"></div>
        <div class="parking-container">
            <div class="parking-row" id="parking-rzad-1"></div>
            <div class="parking-road">PAS RUCHU</div>
            <div class="parking-row" id="parking-rzad-2"></div>
        </div>
        
        <div id="panel-akcji" class="panel-akcji-pilot">
            <h3 id="wybrany-slupek-naglowek">Wybrane miejsce: -</h3>
            <p id="wybrany-slupek-status" style="font-size: 14px;"></p>
            
            <input type="text" id="input-nr-rejestracyjny" class="input-tablica" placeholder="NR REJESTRACYJNY (NP. WI12345)" maxlength="10">
            <div id="komunikat-bledu"></div>
            
            <div class="prip-buttons">
                <button class="btn btn-czerwony" onclick="rezerwujWybrany()">ZABLOKUJ</button>
                <button class="btn btn-zielony" onclick="zwolnijWybrany()">ZWOLNIJ</button>
            </div>
        </div>
        <button class="btn btn-powrot" onclick="przejdzDo('widok-wybor')">Zmień rolę</button>
    </div>

    <div id="widok-wybor-slupka" class="widok">
        <h2>WYBIERZ IDENTYFIKATOR SŁUPKA</h2>
        <div id="kontener-wyboru-slupka" style="width: 100%;"></div>
        <button class="btn btn-powrot" onclick="przejdzDo('widok-wybor')">Zmień rolę</button>
    </div>

    <div id="widok-status-slupka" class="widok">
        <button id="btn-permission" onclick="odblokujSygnalizacje()">
            DOTKNIJ EKRANU TEL. SŁUPKA<br><br>Aby odblokować sygnały dźwiękowe i wibracje
        </button>
        <h2 id="naglowek-slupka">Status Słupka</h2>
        <div id="kolo"></div>
        <div id="tekst">Oczekiwanie na aktywację...</div>
        <button class="btn btn-pomaranczowy" onclick="zwolnijSlupekStacja()">ZWOLNIJ SŁUPEK (AWARYJNIE)</button>
        <div id="debug">Status: Oczekiwanie</div>
        <button class="btn btn-powrot" onclick="wyczyscIPrzejdzDoWyboru()">Zmień słupek</button>
    </div>
